name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pypdf pytest
      # Self-contained suites only. tests/test_soul_api.py,
      # test_soul_cradle.py, test_soul_cradle_integration.py and
      # test_soul_proportion.py need modules that live in Mythara_Archive
      # (fastapi app, soul_cradle_operator, gopher engine, proportion model)
      # and run in that repo's suite.
      - run: pytest tests/test_assessors.py tests/test_emotional_chain.py tests/test_soul_cradle_math.py tests/test_standing.py sdk/tests/ -q
